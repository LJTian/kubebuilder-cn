[book]
authors = ["The Kubebuilder Maintainers"]
src = "src"
title = "Kubebuilder 中文指南"
language = "zh_CN"

[preprocessor.gettext]
after = ["links"]

[build]
extra-watch-dirs = ["po"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
additional-css = ["theme/css/markers.css", "theme/css/custom.css", "theme/css/version-dropdown.css", "theme/css/global-banner.css"]
additional-js = ["theme/js/inject.js"]
git-repository-url = "https://github.com/LJTian/kubebuilder-cn"
edit-url-template = "https://github.com/LJTian/kubebuilder-cn/edit/cn-book-v4/docs/book/{path}"
sidebar-header-nav = false

[preprocessor.literatego]
command = "./litgo.sh"

[preprocessor.markerdocs]
command = "./markerdocs.sh"
