# Sample workflow for building and deploying a mdBook site to Pages (for external CD)
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site for External CD

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["release-4.5"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: read # Required for actions/checkout@v4 to fetch history
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "external-cd"
  cancel-in-progress: false

# Define environment variables
env:
  TARGET_BRANCH: cd-deploy # 你希望提交到的目标分支名称
  COMMIT_MESSAGE: "Auto commit built mdBook site for external CD"

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'release-4.5' }}

      - name: Install Rust and mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update stable
          cargo install mdbook mdbook-i18n-helpers --locked

      - name: Install Go (if required)
        uses: actions/setup-go@v5
        with:
          go-version: '^1.23.8'
        # if: contains(steps.*.outputs.*, 'go.version')

      - name: Build mdBook site
        run: |
          cd docs/book
          /bin/bash -x install-and-build.sh
          # 如果你的 install-and-build.sh 没有构建特定语言，取消注释下一行
          MDBOOK_BOOK__LANGUAGE=zh_CN /tmp/mdbook build -d book/zh_CN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-book
          path: ./docs/book/book/zh_CN # 确保这个路径是正确的

  # Deployment job for external CD
  deploy-external-cd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'release-4.5' }}
          fetch-depth: 0 # 获取完整的历史记录，以便正确推送

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: built-book
          path: /tmp/built-book

      - name: Set up Git user
        run: |
          git config --global user.name "${{ github.event.inputs.committer_name || github.actor }}"
          git config --global user.email "${{ github.event.inputs.committer_email || github.actor }}@users.noreply.github.com"

      - name: Prepare and commit changes
        run: |
          # 切换到目标分支，如果不存在则创建
          git checkout --orphan "${{ env.TARGET_BRANCH }}" || git checkout "${{ env.TARGET_BRANCH }}"

          # 清空目标分支的内容（如果需要）
          rm -rf ./*

          # 将构建好的内容复制到目标分支
          cp -r /tmp/built-book .

          # 添加所有更改
          git add .

          # 提交更改
          git commit -m "${{ env.COMMIT_MESSAGE }}"

      - name: Push changes to target branch
        run: |
          git push origin "${{ env.TARGET_BRANCH }}" --force # 如果需要覆盖目标分支的内容，可以使用 --force
